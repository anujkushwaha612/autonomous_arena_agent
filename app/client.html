<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentChain Chat</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#68738a; --line:#e6eaf0; --brand:#5166e8; --surface:#fff; --page:#f4f6fb; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:linear-gradient(145deg,#eef1ff,#f8f9fc 48%,#eaf8f7); color:var(--ink); font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .app-container { width:min(1000px, 100%); height:min(800px, calc(100vh - 40px)); display: flex; border-radius: 18px; overflow: hidden; background: var(--surface); box-shadow: 0 18px 55px rgba(43,55,95,.15); border: 1px solid rgba(75,91,130,.14); }
    
    /* Auth Overlay */
    #auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .auth-card { background: white; padding: 30px; border-radius: 12px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .auth-card h2 { margin-top: 0; }
    .auth-card input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid var(--line); border-radius: 6px; }
    .auth-card button { width: 100%; padding: 10px; background: var(--brand); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .auth-card .toggle { margin-top: 15px; font-size: 13px; text-align: center; color: var(--muted); }
    .auth-card .toggle span { color: var(--brand); cursor: pointer; }

    /* Sidebar */
    aside { width: 240px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: #f8f9fc; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h2 { margin: 0; font-size: 16px; }
    #room-list { flex: 1; overflow-y: auto; padding: 10px; }
    .room-item { padding: 10px 15px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; transition: background 0.2s; }
    .room-item:hover { background: #eef1ff; }
    .room-item.active { background: var(--brand); color: white; }
    .create-room { padding: 15px; border-top: 1px solid var(--line); }
    .create-room button { width: 100%; padding: 8px; border: 1px dashed var(--brand); background: transparent; color: var(--brand); border-radius: 6px; cursor: pointer; }

    /* Main Chat Area */
    main { flex: 1; display: flex; flex-direction: column; }
    header { display:flex; align-items:center; gap:12px; padding:17px 20px; border-bottom:1px solid var(--line); }
    .mark { width:36px; height:36px; display:grid; place-items:center; border-radius:11px; background:var(--brand); color:#fff; font-weight:800; }
    h1 { margin:0; font-size:16px; } .sub { color:var(--muted); font-size:12px; }
    #status { margin-left:auto; display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; } .dot { width:8px; height:8px; border-radius:50%; background:#a8b0c0; } .connected .dot { background:#22a06b; box-shadow:0 0 0 3px #def5e9; } .error .dot { background:#d64646; }
    
    #messages { flex:1; overflow-y:auto; padding:20px; background:linear-gradient(#fff,#fbfcff); }
    .message { max-width:82%; margin:0 0 16px; } .message.mine { margin-left:auto; } .meta { display:flex; gap:8px; align-items:baseline; margin:0 4px 4px; color:var(--muted); font-size:12px; } .mine .meta { justify-content:flex-end; } .name { color:var(--ink); font-weight:700; }
    .bubble { padding:10px 13px; border:1px solid var(--line); border-radius:4px 14px 14px; background:#fff; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 2px rgba(20,30,55,.03); } .mine .bubble { border-color:transparent; border-radius:14px 4px 14px 14px; background:var(--brand); color:white; }
    
    form#composer { display:flex; gap:10px; padding:14px 16px; border-top:1px solid var(--line); background:#fff; } 
    form#composer input { min-width:0; flex:1; padding:11px 13px; border:1px solid #cfd6e3; border-radius:10px; outline:none; font:inherit; } 
    form#composer button { border:0; border-radius:10px; padding:0 17px; background:var(--brand); color:white; font:inherit; font-weight:700; cursor:pointer; }
    
    .hidden { display: none !important; }

    /* Reactions */
    .message-wrap { position: relative; }
    .message-wrap:hover .react-btn { opacity: 1; pointer-events: auto; }
    .react-btn { position: absolute; top: -6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: white; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 2; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .react-btn:hover { background: #eef1ff; }
    .emoji-picker { display: none; position: absolute; top: 22px; right: 0; background: white; border: 1px solid var(--line); border-radius: 10px; padding: 6px; z-index: 10; box-shadow: 0 6px 20px rgba(0,0,0,0.12); white-space: nowrap; }
    .emoji-picker.open { display: flex; gap: 4px; }
    .emoji-picker span { padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 18px; transition: background 0.15s; }
    .emoji-picker span:hover { background: #eef1ff; }
    .reactions-bar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .reaction-pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 12px; border: 1px solid var(--line); background: #f4f6fb; font-size: 13px; cursor: pointer; transition: background 0.15s; }
    .reaction-pill:hover { background: #eef1ff; }
    .reaction-pill.mine { background: #e0e4ff; border-color: var(--brand); }
    .reaction-pill .count { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="auth-overlay">
    <div class="auth-card" id="login-form">
      <h2>Login</h2>
      <input type="text" id="login-username" placeholder="Username">
      <input type="password" id="login-password" placeholder="Password">
      <button onclick="handleLogin()">Login</button>
      <p class="toggle">Don't have an account? <span onclick="toggleAuth()">Register</span></p>
    </div>
    <div class="auth-card hidden" id="register-form">
      <h2>Register</h2>
      <input type="text" id="reg-username" placeholder="Username (3-20 alphanumeric)">
      <input type="password" id="reg-password" placeholder="Password (min 6)">
      <button onclick="handleRegister()">Register</button>
      <p class="toggle">Already have an account? <span onclick="toggleAuth()">Login</span></p>
    </div>
  </div>

  <div class="app-container">
    <aside>
      <div class="sidebar-header">
        <h2>Rooms</h2>
      </div>
      <div id="room-list">
        <!-- Rooms will be listed here -->
      </div>
      <div class="create-room">
        <button onclick="promptCreateRoom()">+ Create Room</button>
      </div>
    </aside>
    
    <main>
      <header>
        <div class="mark">A</div>
        <div><h1 id="active-room-name">General</h1><div class="sub" id="identity">Not logged in</div></div>
        <div id="status"><span class="dot"></span><span>Connecting…</span></div>
        <button onclick="handleLogout()" style="margin-left: 15px; padding: 4px 8px; font-size: 11px;">Logout</button>
      </header>
      <section id="messages">
        <div class="empty">Select a room to start chatting</div>
      </section>
      <form id="composer">
        <input id="message-input" type="text" placeholder="Write a message…" autocomplete="off" disabled>
        <button id="send-btn" type="submit" disabled>Send</button>
      </form>
    </main>
  </div>

  <script>
    let token = localStorage.getItem('agentchain-token');
    let username = localStorage.getItem('agentchain-username');
    let currentRoomId = 'general';
    let socket;

    const authOverlay = document.getElementById('auth-overlay');
    const roomList = document.getElementById('room-list');
    const messages = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const activeRoomName = document.getElementById('active-room-name');
    const identity = document.getElementById('identity');
    const status = document.getElementById('status');

    function toggleAuth() {
      document.getElementById('login-form').classList.toggle('hidden');
      document.getElementById('register-form').classList.toggle('hidden');
    }

    async function handleRegister() {
      const u = document.getElementById('reg-username').value;
      const p = document.getElementById('reg-password').value;
      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (data.success) {
        alert('Registered! Please login.');
        toggleAuth();
      } else {
        alert(data.error);
      }
    }

    async function handleLogin() {
      const u = document.getElementById('login-username').value;
      const p = document.getElementById('login-password').value;
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (data.success) {
        token = data.token;
        username = data.username;
        localStorage.setItem('agentchain-token', token);
        localStorage.setItem('agentchain-username', username);
        authOverlay.classList.add('hidden');
        initApp();
      } else {
        alert(data.error);
      }
    }

    function handleLogout() {
      localStorage.removeItem('agentchain-token');
      localStorage.removeItem('agentchain-username');
      location.reload();
    }

    async function initApp() {
      if (!token) return;
      authOverlay.classList.add('hidden');
      identity.textContent = `Chatting as ${username}`;
      await loadRooms();
      connect();
    }

    async function loadRooms() {
      const res = await fetch('/rooms', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (data.success) {
        renderRooms(data.rooms);
      }
    }

    function renderRooms(rooms) {
      roomList.innerHTML = '';
      rooms.forEach(room => {
        const div = document.createElement('div');
        div.className = `room-item ${room.id === currentRoomId ? 'active' : ''}`;
        div.textContent = `# ${room.name}`;
        div.onclick = () => switchRoom(room.id, room.name);
        roomList.appendChild(div);
      });
    }

    async function promptCreateRoom() {
      const name = prompt('Enter room name:');
      if (!name) return;
      const res = await fetch('/rooms', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ name })
      });
      const data = await res.json();
      if (data.success) {
        await loadRooms();
        switchRoom(data.room.id, data.room.name);
      } else {
        alert(data.error);
      }
    }

    function switchRoom(roomId, roomName) {
      if (currentRoomId === roomId) return;
      currentRoomId = roomId;
      activeRoomName.textContent = roomName;
      document.querySelectorAll('.room-item').forEach(el => {
        el.classList.toggle('active', el.textContent.includes(roomName));
      });
      messages.innerHTML = '';
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'getHistory', roomId }));
      }
    }

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      const wsUrl = `${protocol}://${location.host}?token=${token}`;
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        status.className = 'connected';
        status.querySelector('span:last-child').textContent = 'Connected';
        messageInput.disabled = false;
        sendBtn.disabled = false;
        socket.send(JSON.stringify({ type: 'getHistory', roomId: currentRoomId }));
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'history') {
          if (data.roomId === currentRoomId) {
            messages.innerHTML = '';
            data.messages.forEach(displayMessage);
          }
        } else if (data.type === 'message') {
          if (data.roomId === currentRoomId) {
            displayMessage(data);
          }
        } else if (data.type === 'reaction') {
          if (data.message && data.message.roomId === currentRoomId) {
            updateMessageInDOM(data.message);
          }
        } else if (data.type === 'error') {
          console.error(data.error);
        }
      };

      socket.onclose = () => {
        status.className = 'error';
        status.querySelector('span:last-child').textContent = 'Disconnected';
        messageInput.disabled = true;
        sendBtn.disabled = true;
        setTimeout(connect, 3000);
      };
    }

    const COMMON_EMOJIS = ['👍', '❤️', '😂', '🎉', '👀'];

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function displayMessage(msg) {
      const div = document.createElement('article');
      div.className = `message ${msg.username === username ? 'mine' : ''}`;
      div.setAttribute('data-msg-id', msg.id);

      const wrap = document.createElement('div');
      wrap.className = 'message-wrap';

      const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Reaction button + emoji picker
      const reactBtn = document.createElement('button');
      reactBtn.className = 'react-btn';
      reactBtn.innerHTML = '😊';
      reactBtn.title = 'Add reaction';

      const picker = document.createElement('div');
      picker.className = 'emoji-picker';
      COMMON_EMOJIS.forEach((emoji) => {
        const span = document.createElement('span');
        span.textContent = emoji;
        span.onclick = (e) => {
          e.stopPropagation();
          toggleReaction(msg.id, emoji);
          picker.classList.remove('open');
        };
        picker.appendChild(span);
      });

      reactBtn.onclick = (e) => {
        e.stopPropagation();
        picker.classList.toggle('open');
      };

      // Close picker when clicking elsewhere
      document.addEventListener('click', function closePicker(e) {
        if (!picker.contains(e.target) && e.target !== reactBtn) {
          picker.classList.remove('open');
        }
      }, { once: false });

      const metaHtml = `
        <div class="meta">
          <span class="name">${esc(msg.username)}</span>
          <time>${time}</time>
        </div>
        <div class="bubble">${esc(msg.content)}</div>
      `;

      const reactionsBar = document.createElement('div');
      reactionsBar.className = 'reactions-bar';
      renderReactions(reactionsBar, msg);

      wrap.innerHTML = metaHtml;
      wrap.appendChild(reactionsBar);
      wrap.appendChild(reactBtn);
      wrap.appendChild(picker);
      div.appendChild(wrap);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function renderReactions(container, msg) {
      container.innerHTML = '';
      if (!msg.reactions) return;
      Object.entries(msg.reactions).forEach(([emoji, users]) => {
        if (!users || users.length === 0) return;
        const pill = document.createElement('span');
        pill.className = 'reaction-pill';
        if (users.includes(username)) pill.classList.add('mine');
        pill.innerHTML = `${emoji} <span class="count">${users.length}</span>`;
        pill.title = users.join(', ');
        pill.onclick = () => toggleReaction(msg.id, emoji);
        container.appendChild(pill);
      });
    }

    function updateMessageInDOM(msg) {
      const article = document.querySelector(`[data-msg-id="${msg.id}"]`);
      if (!article) return;
      const bar = article.querySelector('.reactions-bar');
      if (bar) renderReactions(bar, msg);
    }

    async function toggleReaction(messageId, emoji) {
      // Find the message element to check if we already reacted
      const article = document.querySelector(`[data-msg-id="${messageId}"]`);
      const pill = article ? article.querySelector(`.reaction-pill:has(+ *)`) : null;
      // Check if current user already has this reaction by inspecting DOM
      let hasReaction = false;
      if (article) {
        const bar = article.querySelector('.reactions-bar');
        if (bar) {
          const pills = bar.querySelectorAll('.reaction-pill');
          pills.forEach((p) => {
            if (p.textContent.startsWith(emoji) && p.classList.contains('mine')) {
              hasReaction = true;
            }
          });
        }
      }

      if (hasReaction) {
        // Remove reaction via REST
        try {
          const res = await fetch(`/messages/${encodeURIComponent(messageId)}/react/${encodeURIComponent(emoji)}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.success) updateMessageInDOM(data.message);
        } catch (err) {
          console.error('Failed to remove reaction:', err);
        }
      } else {
        // Add reaction via WebSocket for speed, REST as fallback
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            type: 'reaction',
            messageId,
            emoji,
            action: 'add'
          }));
        } else {
          try {
            const res = await fetch(`/messages/${encodeURIComponent(messageId)}/react`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
              body: JSON.stringify({ emoji })
            });
            const data = await res.json();
            if (data.success) updateMessageInDOM(data.message);
          } catch (err) {
            console.error('Failed to add reaction:', err);
          }
        }
      }
    }

    document.getElementById('composer').onsubmit = (e) => {
      e.preventDefault();
      const content = messageInput.value.trim();
      if (!content || !socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({
        type: 'message',
        roomId: currentRoomId,
        username,
        content
      }));
      messageInput.value = '';
    };

    if (token) {
      initApp();
    } else {
      authOverlay.classList.remove('hidden');
    }
  </script>
</body>
</html>
