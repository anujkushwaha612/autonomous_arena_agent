<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentChain Chat</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#68738a; --line:#e6eaf0; --brand:#5166e8; --surface:#fff; --page:#f4f6fb; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:linear-gradient(145deg,#eef1ff,#f8f9fc 48%,#eaf8f7); color:var(--ink); font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .chat { width:min(780px,100%); height:min(720px,calc(100vh - 40px)); min-height:460px; display:flex; flex-direction:column; overflow:hidden; border:1px solid rgba(75,91,130,.14); border-radius:18px; background:var(--surface); box-shadow:0 18px 55px rgba(43,55,95,.15); }
    header { display:flex; align-items:center; gap:12px; padding:17px 20px; border-bottom:1px solid var(--line); }
    .mark { width:36px; height:36px; display:grid; place-items:center; border-radius:11px; background:var(--brand); color:#fff; font-weight:800; }
    h1 { margin:0; font-size:16px; } .sub { color:var(--muted); font-size:12px; }
    #status { margin-left:auto; display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; } .dot { width:8px; height:8px; border-radius:50%; background:#a8b0c0; } .connected .dot { background:#22a06b; box-shadow:0 0 0 3px #def5e9; } .error .dot { background:#d64646; }
    #messages { flex:1; overflow-y:auto; padding:20px; background:linear-gradient(#fff,#fbfcff); }
    .empty { height:100%; display:grid; place-items:center; text-align:center; color:var(--muted); } .empty p { margin:5px 0; }
    .message { max-width:82%; margin:0 0 16px; } .message.mine { margin-left:auto; } .meta { display:flex; gap:8px; align-items:baseline; margin:0 4px 4px; color:var(--muted); font-size:12px; } .mine .meta { justify-content:flex-end; } .name { color:var(--ink); font-weight:700; }
    .bubble { padding:10px 13px; border:1px solid var(--line); border-radius:4px 14px 14px; background:#fff; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 2px rgba(20,30,55,.03); } .mine .bubble { border-color:transparent; border-radius:14px 4px 14px 14px; background:var(--brand); color:white; }
    .divider { display:flex; align-items:center; gap:10px; margin:0 0 16px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; } .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--line); }
    form { display:flex; gap:10px; padding:14px 16px; border-top:1px solid var(--line); background:#fff; } input { min-width:0; flex:1; padding:11px 13px; border:1px solid #cfd6e3; border-radius:10px; outline:none; font:inherit; } input:focus { border-color:var(--brand); box-shadow:0 0 0 3px #e6eaff; } button { border:0; border-radius:10px; padding:0 17px; background:var(--brand); color:white; font:inherit; font-weight:700; cursor:pointer; } button:disabled { cursor:not-allowed; opacity:.5; }
    @media (max-width:520px) { body { padding:0; } .chat { height:100vh; border:0; border-radius:0; } header { padding:14px; } #messages { padding:15px; } .message { max-width:90%; } }
  </style>
</head>
<body>
  <main class="chat" aria-label="AgentChain chat">
    <header><div class="mark" aria-hidden="true">A</div><div><h1>AgentChain Chat</h1><div class="sub" id="identity"></div></div><div id="status" aria-live="polite"><span class="dot"></span><span>Connecting…</span></div></header>
    <section id="messages" aria-live="polite"><div class="empty" id="empty"><div><p><strong>Welcome to the chat.</strong></p><p>Messages sent here are shared with everyone connected.</p></div></div></section>
    <form id="composer"><input id="message-input" type="text" maxlength="4000" placeholder="Write a message…" autocomplete="off" disabled aria-label="Message"><button id="send" type="submit" disabled>Send</button></form>
  </main>
  <script>
    (() => {
      const status = document.getElementById('status');
      const identity = document.getElementById('identity');
      const messages = document.getElementById('messages');
      const empty = document.getElementById('empty');
      const form = document.getElementById('composer');
      const input = document.getElementById('message-input');
      const send = document.getElementById('send');
      let username = (localStorage.getItem('agentchain-username') || '').trim();
      while (!username) { username = (window.prompt('Choose a username for this chat:') || '').trim(); }
      localStorage.setItem('agentchain-username', username);
      identity.textContent = `Chatting as ${username}`;

      function setStatus(label, state) { status.className = state || ''; status.lastElementChild.textContent = label; const ready = state === 'connected'; input.disabled = !ready; send.disabled = !ready; if (ready) input.focus(); }
      function socketUrl() { if (location.protocol === 'http:' || location.protocol === 'https:') return `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`; return 'ws://localhost:3000'; }
      function displayMessage(message) {
        empty?.remove();
        const item = document.createElement('article'); item.className = `message${message.username === username ? ' mine' : ''}`;
        const meta = document.createElement('div'); meta.className = 'meta';
        const name = document.createElement('span'); name.className = 'name'; name.textContent = message.username || 'Unknown';
        const time = document.createElement('time'); const date = new Date(message.timestamp); time.dateTime = message.timestamp || ''; time.textContent = Number.isNaN(date.getTime()) ? '' : date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        meta.append(name, time); const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = message.content || '';
        item.append(meta, bubble); messages.append(item); messages.scrollTop = messages.scrollHeight;
      }
      let socket;
      function connect() {
        setStatus('Connecting…');
        socket = new WebSocket(socketUrl());
        socket.addEventListener('open', () => setStatus('Connected', 'connected'));
        socket.addEventListener('message', ({ data }) => { try { const event = JSON.parse(data); if (event.type === 'history') { messages.querySelectorAll('.message, .divider').forEach(node => node.remove()); (event.messages || []).forEach(displayMessage); if (event.messages && event.messages.length) { const divider = document.createElement('div'); divider.className = 'divider'; divider.textContent = 'Earlier messages loaded'; messages.append(divider); messages.scrollTop = messages.scrollHeight; } } else if (event.type === 'message') displayMessage(event); else if (event.type === 'error') setStatus(event.error, 'error'); } catch (_) { setStatus('Received an invalid server response', 'error'); } });
        socket.addEventListener('close', () => { setStatus('Disconnected — retrying…', 'error'); window.setTimeout(connect, 2000); });
        socket.addEventListener('error', () => setStatus('Connection error', 'error'));
      }
      form.addEventListener('submit', event => { event.preventDefault(); const content = input.value.trim(); if (!content || !socket || socket.readyState !== WebSocket.OPEN) return; socket.send(JSON.stringify({ type: 'message', content, username })); input.value = ''; });
      connect();
    })();
  </script>
</body>
</html>
