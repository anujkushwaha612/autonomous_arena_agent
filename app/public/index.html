<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Impostor — a social deduction game</title>
  <meta name="description" content="Impostor: a browser social-deduction game for 4-12 players. No install, no account." />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <main class="menu-root">
    <header class="brand">
      <h1 class="brand-title">
        <span class="brand-word brand-word--among">IMPOSTOR</span>
      </h1>
      <p class="brand-tagline">A social deduction game &mdash; trust no one.</p>
    </header>

    <section class="panel" aria-label="Main menu">
      <div class="panel-inner">
        <div class="crewmate-spinner" role="status" aria-label="Loading">
          <svg viewBox="0 0 100 100" class="crewmate-svg">
            <ellipse cx="50" cy="88" rx="22" ry="6" class="crewmate-shadow" />
            <path
              class="crewmate-backpack"
              d="M70 40 Q82 40 82 55 L82 70 Q82 80 70 80 Z"
            />
            <path
              class="crewmate-body"
              d="M30 30
                 Q30 12 55 12
                 Q78 12 78 34
                 L78 62
                 Q78 82 55 82
                 Q30 82 30 60
                 Z"
            />
            <path
              class="crewmate-visor"
              d="M40 32 Q40 22 56 22 Q70 22 70 34 L70 42 Q70 50 58 50 L44 50 Q40 50 40 44 Z"
            />
            <ellipse cx="52" cy="30" rx="7" ry="4" class="crewmate-shine" />
          </svg>
        </div>

        <p id="conn-status" class="conn-status" data-state="connecting">Connecting&hellip;</p>

        <div class="menu-buttons">
          <button class="btn btn--primary" type="button" disabled title="Coming in a later build">
            Find game
          </button>
          <button class="btn" type="button" disabled title="Coming in a later build">
            Create room
          </button>
          <button class="btn" type="button" disabled title="Coming in a later build">
            Join with code
          </button>
        </div>

        <p class="footnote">Rooms, lobbies and gameplay ship in later builds of this pipeline.</p>
      </div>
    </section>

    <div class="crewmate-decor crewmate-decor--left" aria-hidden="true"></div>
    <div class="crewmate-decor crewmate-decor--right" aria-hidden="true"></div>
  </main>

  <script type="module" src="/bundle.js"></script>
</body>
</html>
